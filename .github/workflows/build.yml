name: Build

permissions:
    contents: write

on:
    push:
        branches:
            - '**'
    release:
        types: [ created ]
    pull_request:
        types: [ opened, synchronize, reopened ]

jobs:
    build:
        name: Build
        runs-on: windows-latest
        if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.repository != 'pavledev/HitmanAbsolutionSDK'

        steps:
            -   name: Get latest CMake and ninja
                uses: lukka/get-cmake@latest

            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    submodules: recursive

            -   name: Setup VS environment
                uses: ilammy/msvc-dev-cmd@v1
                with:
                    arch: x86

            -   name: Build and install debug
                run: |
                    cmake --preset x86-Debug .
                    cmake --build _build/x86-Debug -j12
                    cmake --install _build/x86-Debug

            -   name: Build and install release
                run: |
                    cmake --preset x86-Release .
                    cmake --build _build/x86-Release -j12
                    cmake --install _build/x86-Release

            -   name: Copy debug artifacts
                run: |
                    mkdir _dist-debug
                    Copy-Item _install/x86-Debug/bin/* -Destination _dist-debug/ -Recurse
                    Copy-Item _install/x86-Debug/licenses -Destination _dist-debug/ -Recurse
                    Copy-Item LICENSE -Destination _dist-debug/LICENSE

            -   name: Copy release artifacts
                run: |
                    mkdir _dist-release
                    Copy-Item _install/x86-Release/bin/* -Destination _dist-release/ -Recurse
                    Copy-Item _install/x86-Release/licenses -Destination _dist-release/ -Recurse
                    Copy-Item LICENSE -Destination _dist-release/LICENSE

            -   name: Copy SDK dev artifacts
                run: |
                    mkdir _sdk
                    Copy-Item cmake/sdk-dist.cmake -Destination _sdk/CMakeLists.txt
                    Copy-Item _install/x86-Release/include -Destination _sdk/ -Recurse
                    
                    mkdir _sdk/release
                    Copy-Item _install/x86-Release/lib -Destination _sdk/release/ -Recurse
                    Copy-Item _install/x86-Release/bin -Destination _sdk/release/ -Recurse
                    Remove-Item _sdk/release/bin/mods -Recurse
                    Remove-Item _sdk/release/bin/dinput8.dll
                    Remove-Item _sdk/release/bin/dinput8.pdb
                    
                    mkdir _sdk/debug
                    Copy-Item _install/x86-Debug/lib -Destination _sdk/debug/ -Recurse
                    Copy-Item _install/x86-Debug/bin -Destination _sdk/debug/ -Recurse
                    Remove-Item _sdk/debug/bin/mods -Recurse
                    Remove-Item _sdk/debug/bin/dinput8.dll
                    Remove-Item _sdk/debug/bin/dinput8.pdb
                    
                    mkdir _sdk/cmake
                    Copy-Item cmake/hma-mod.cmake -Destination _sdk/cmake/hma-mod.cmake
                    
                    Copy-Item _install/x86-Release/licenses -Destination _sdk/ -Recurse
                    Copy-Item LICENSE -Destination _sdk/LICENSE

            -   name: Upload debug SDK and mods
                uses: actions/upload-artifact@v4
                with:
                    name: HitmanAbsolutionSDK-Debug
                    path: _dist-debug/*

            -   name: Move release PDBs recursively into a separate folder
                shell: powershell
                run: |
                    mkdir _dist-release-pdbs
                    Get-ChildItem -Path _dist-release\* -Include *.pdb -Recurse | Move-Item -Destination _dist-release-pdbs

            -   name: Archive release SDK and mods
                uses: actions/upload-artifact@v4
                with:
                    name: HitmanAbsolutionSDK-Release
                    path: _dist-release/*

            -   name: Archive release PDBs
                uses: actions/upload-artifact@v4
                with:
                    name: HitmanAbsolutionSDK-Release-PDBs
                    path: _dist-release-pdbs/*

            -   name: Archive SDK dev package
                uses: actions/upload-artifact@v4
                with:
                    name: DevPkg-HitmanAbsolutionSDK
                    path: _sdk/*

    upload_release:
        name: Upload release artifacts
        needs: build
        if: github.repository == 'pavledev/HitmanAbsolutionSDK' && github.event_name == 'release'
        runs-on: ubuntu-latest

        strategy:
            matrix:
                artifact:
                    - HitmanAbsolutionSDK-Release
                    - HitmanAbsolutionSDK-Release-PDBs
                    - HitmanAbsolutionSDK-Debug
                    - DevPkg-HitmanAbsolutionSDK

        steps:
            -   name: Download artifact
                uses: actions/download-artifact@v4
                with:
                    name: ${{ matrix.artifact }}
                    path: ${{ matrix.artifact }}

            -   name: Archive artifact files
                run: |
                    cd ${{ matrix.artifact }}
                    zip -r ${{ matrix.artifact }}.zip *

            -   name: Get release
                id: get_release
                uses: bruceadams/get-release@v1.2.2
                env:
                    GITHUB_TOKEN: ${{ github.token }}

            -   name: Upload release assets
                uses: actions/upload-release-asset@v1
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                with:
                    upload_url: ${{ steps.get_release.outputs.upload_url }}
                    asset_path: ${{ matrix.artifact }}/${{ matrix.artifact }}.zip
                    asset_name: ${{ matrix.artifact }}.zip
                    asset_content_type: application/zip